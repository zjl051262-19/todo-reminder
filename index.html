<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待办提醒</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 12px;
      background: #f4f6f8;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    header {
      margin: 0 0 14px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .note,
    .help,
    .sync-status {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .active-space {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 0 0;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 12px;
      background: #eff6ff;
      color: #1e3a8a;
      font-weight: 700;
    }

    .active-space span {
      color: #1d4ed8;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-bottom: 12px;
      background: #ffffff;
      border: 1px solid #d9e1ea;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .alert {
      display: none;
      border: 2px solid #dc2626;
      background: #fff1f2;
      color: #991b1b;
      font-weight: 700;
      line-height: 1.5;
    }

    .alert.show {
      display: block;
    }

    form,
    .sync-grid {
      display: grid;
      grid-template-columns: 1fr 210px 96px 96px;
      gap: 10px;
      margin-bottom: 14px;
    }

    .sync-grid {
      grid-template-columns: 1fr 1fr 88px 96px;
      margin: 12px 0 8px;
    }

    input,
    button {
      min-height: 44px;
      border-radius: 7px;
      font: inherit;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      padding: 0 11px;
      background: #ffffff;
      color: #1f2937;
    }

    button {
      border: 0;
      padding: 0 12px;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
    }

    button.secondary {
      background: #eef2f7;
      color: #334155;
    }

    button.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .empty {
      margin: 20px 0 8px;
      color: #64748b;
      text-align: center;
    }

    .todo {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid #d9e1ea;
      border-left: 6px solid #94a3b8;
      border-radius: 8px;
      padding: 12px;
      background: #ffffff;
    }

    .todo.due-soon {
      border-left-color: #f59e0b;
      background: #fffbeb;
    }

    .todo.overdue {
      border-left-color: #dc2626;
      background: #fff1f2;
    }

    .todo.done {
      opacity: 0.62;
      background: #f8fafc;
    }

    .todo.done .title {
      text-decoration: line-through;
    }

    .title {
      margin: 0 0 6px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .meta {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.45;
    }

    .status {
      display: inline-block;
      margin-left: 8px;
      color: #111827;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px 10px;
      }

      h1 {
        font-size: 24px;
      }

      form,
      .sync-grid,
      .todo {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: stretch;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>待办提醒</h1>
      <p class="note">电脑和手机都设置同一个 GitHub Token 和验证码后，同一个验证码共享同一份加密待办。</p>
    </header>

    <section id="alert" class="panel alert" aria-live="polite"></section>

    <section class="panel">
      <form id="todoForm">
        <input id="titleInput" type="text" placeholder="待办事项" autocomplete="off" required>
        <input id="dueInput" type="datetime-local" required>
        <button id="submitTodoButton" type="submit">添加</button>
        <button id="cancelEditButton" class="secondary" type="button" hidden>取消</button>
      </form>

      <ul id="todoList" class="list"></ul>
      <p id="emptyState" class="empty">暂无待办</p>
    </section>

    <section class="panel">
      <h2>同步</h2>
      <p class="help">Token 和验证码只保存在当前浏览器；同一个验证码共享数据，不同验证码会切换到不同待办列表。</p>
      <div class="active-space">当前库：<span id="activeSpaceName">本机默认库</span></div>
      <div class="sync-grid">
        <input id="tokenInput" type="password" placeholder="GitHub Token">
        <input id="passphraseInput" type="password" placeholder="验证码">
        <button id="saveSyncButton" type="button">保存并切换</button>
        <button id="syncNowButton" class="secondary" type="button">立即同步</button>
      </div>
      <p id="syncStatus" class="sync-status" aria-live="polite">未设置同步。</p>
    </section>
  </main>

  <script>
    const STORAGE_KEY_PREFIX = "publicTodoReminder.todos.v2.";
    const OLD_STORAGE_KEY = "publicTodoReminder.todos.v2";
    const LEGACY_STORAGE_KEY = "publicTodoReminder.todos.v1";
    const SYNC_CONFIG_KEY = "publicTodoReminder.syncConfig.v1";
    const TWO_DAYS_MS = 2 * 24 * 60 * 60 * 1000;
    const GITHUB_OWNER = "zjl051262-19";
    const GITHUB_REPO = "todo-reminder";
    const GITHUB_BRANCH = "main";
    const SYNC_FILE_PREFIX = "sync-data-";
    const SYNC_FILE_SUFFIX = ".json";

    const form = document.querySelector("#todoForm");
    const titleInput = document.querySelector("#titleInput");
    const dueInput = document.querySelector("#dueInput");
    const submitTodoButton = document.querySelector("#submitTodoButton");
    const cancelEditButton = document.querySelector("#cancelEditButton");
    const list = document.querySelector("#todoList");
    const emptyState = document.querySelector("#emptyState");
    const alertBox = document.querySelector("#alert");
    const tokenInput = document.querySelector("#tokenInput");
    const passphraseInput = document.querySelector("#passphraseInput");
    const saveSyncButton = document.querySelector("#saveSyncButton");
    const syncNowButton = document.querySelector("#syncNowButton");
    const syncStatus = document.querySelector("#syncStatus");
    const activeSpaceName = document.querySelector("#activeSpaceName");

    let syncConfig = loadSyncConfig();
    let todos = loadTodos();
    let editingId = null;
    let syncTimer = 0;
    let isSyncing = false;

    tokenInput.value = syncConfig.token || "";
    passphraseInput.value = syncConfig.code || "";
    updateActiveSpace();
    updateSyncStatus(hasSyncConfig() ? `同步已设置。当前验证码：${maskCode(syncConfig.code)}` : "未设置同步。");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const dueAt = dueInput.value;
      if (!title || !dueAt) return;

      const now = new Date().toISOString();
      if (editingId) {
        todos = todos.map((todo) => (
          todo.id === editingId ? { ...todo, title, dueAt, updatedAt: now } : todo
        ));
      } else {
        todos.push({
          id: createId(),
          title,
          dueAt,
          done: false,
          createdAt: now,
          updatedAt: now
        });
      }

      resetTodoForm();
      saveTodos();
      render();
      scheduleSync();
      titleInput.focus();
    });

    list.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const item = button.closest(".todo");
      const action = button.dataset.action;
      const id = item.dataset.id;
      const now = new Date().toISOString();

      if (action === "toggle") {
        todos = todos.map((todo) => (
          todo.id === id ? { ...todo, done: !todo.done, updatedAt: now } : todo
        ));
      }

      if (action === "delete") {
        todos = todos.map((todo) => (
          todo.id === id ? { ...todo, deletedAt: now, updatedAt: now } : todo
        ));
        if (editingId === id) {
          resetTodoForm();
        }
      }

      if (action === "edit") {
        const todo = todos.find((item) => item.id === id);
        if (!todo) return;
        editingId = id;
        titleInput.value = todo.title;
        dueInput.value = todo.dueAt;
        submitTodoButton.textContent = "保存修改";
        cancelEditButton.hidden = false;
        titleInput.focus();
        return;
      }

      saveTodos();
      render();
      scheduleSync();
    });

    cancelEditButton.addEventListener("click", () => {
      resetTodoForm();
    });

    saveSyncButton.addEventListener("click", () => {
      const oldConfig = syncConfig;
      const nextConfig = {
        token: tokenInput.value.trim(),
        code: passphraseInput.value.trim()
      };
      const oldKey = todosStorageKey(oldConfig);
      const nextKey = todosStorageKey(nextConfig);

      syncConfig = nextConfig;
      saveSyncConfig(syncConfig);

      if (oldKey !== nextKey) {
        if (!oldConfig.code && nextConfig.code && !hasTodosForConfig(nextConfig) && todos.length) {
          saveTodos();
        } else {
          todos = loadTodos();
          render();
        }
      }

      updateSyncStatus(hasSyncConfig() ? `已切换到验证码：${maskCode(syncConfig.code)}，正在同步...` : "未设置同步。");
      updateActiveSpace();
      if (hasSyncConfig()) {
        syncNow();
      }
    });

    passphraseInput.addEventListener("input", () => {
      const nextCode = passphraseInput.value.trim();
      if (nextCode && nextCode !== syncConfig.code) {
        activeSpaceName.textContent = `${spaceLabel(syncConfig.code)}（待切换到：${nextCode}）`;
      } else {
        updateActiveSpace();
      }
    });

    syncNowButton.addEventListener("click", () => {
      syncNow();
    });

    if (hasSyncConfig()) {
      syncNow();
    }

    function loadTodos() {
      let saved = localStorage.getItem(todosStorageKey());
      if (!saved && !syncConfig.code) {
        saved = localStorage.getItem(OLD_STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
      }
      if (!saved) return [];
      try {
        const parsed = JSON.parse(saved);
        return parsed.map(normalizeTodo);
      } catch {
        return [];
      }
    }

    function normalizeTodo(todo) {
      const now = new Date().toISOString();
      return {
        id: todo.id || createId(),
        title: todo.title || "",
        dueAt: todo.dueAt || "",
        done: Boolean(todo.done),
        createdAt: todo.createdAt || now,
        updatedAt: todo.updatedAt || todo.createdAt || now,
        deletedAt: todo.deletedAt || null
      };
    }

    function saveTodos() {
      localStorage.setItem(todosStorageKey(), JSON.stringify(todos));
    }

    function todosStorageKey(config = syncConfig) {
      return `${STORAGE_KEY_PREFIX}${storageScope(config.code)}`;
    }

    function hasTodosForConfig(config) {
      return Boolean(localStorage.getItem(todosStorageKey(config)));
    }

    function storageScope(code) {
      if (!code) return "local";
      let hash = 2166136261;
      for (let i = 0; i < code.length; i += 1) {
        hash ^= code.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16).padStart(8, "0");
    }

    function maskCode(code) {
      if (!code) return "";
      if (code.length <= 4) return "****";
      return `${code.slice(0, 2)}***${code.slice(-2)}`;
    }

    function updateActiveSpace() {
      activeSpaceName.textContent = spaceLabel(syncConfig.code);
    }

    function spaceLabel(code) {
      return code ? code : "本机默认库";
    }

    function loadSyncConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)) || {};
        return {
          token: saved.token || "",
          code: saved.code || saved.passphrase || ""
        };
      } catch {
        return {
          token: "",
          code: ""
        };
      }
    }

    function saveSyncConfig(config) {
      localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(config));
    }

    function createId() {
      if (window.crypto && window.crypto.randomUUID) {
        return window.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function getVisibleTodos() {
      return todos.filter((todo) => !todo.deletedAt);
    }

    function getState(todo) {
      if (todo.done) return "done";

      const dueTime = new Date(todo.dueAt).getTime();
      const now = Date.now();
      if (dueTime < now) return "overdue";
      if (dueTime - now <= TWO_DAYS_MS) return "due-soon";
      return "normal";
    }

    function render() {
      const visibleTodos = getVisibleTodos();
      const activeWarnings = visibleTodos.filter((todo) => {
        const state = getState(todo);
        return state === "overdue" || state === "due-soon";
      });

      if (activeWarnings.length) {
        const overdueCount = activeWarnings.filter((todo) => getState(todo) === "overdue").length;
        const soonCount = activeWarnings.length - overdueCount;
        alertBox.textContent = `提醒：${overdueCount} 个已过期，${soonCount} 个将在两天内到期。`;
        alertBox.classList.add("show");
      } else {
        alertBox.textContent = "";
        alertBox.classList.remove("show");
      }

      const sorted = [...visibleTodos].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return new Date(a.dueAt) - new Date(b.dueAt);
      });

      list.innerHTML = "";
      emptyState.style.display = sorted.length ? "none" : "block";

      for (const todo of sorted) {
        const state = getState(todo);
        const item = document.createElement("li");
        item.className = `todo ${state}`;
        item.dataset.id = todo.id;

        const statusText = {
          overdue: "已过期",
          "due-soon": "快到期",
          done: "已完成",
          normal: ""
        }[state];

        item.innerHTML = `
          <div>
            <p class="title"></p>
            <p class="meta">
              截止：<time></time>
              ${statusText ? `<span class="status">${statusText}</span>` : ""}
            </p>
          </div>
          <div class="actions">
            <button class="secondary" type="button" data-action="toggle">${todo.done ? "恢复" : "完成"}</button>
            <button class="secondary" type="button" data-action="edit">编辑</button>
            <button class="danger" type="button" data-action="delete">删除</button>
          </div>
        `;

        item.querySelector(".title").textContent = todo.title;
        item.querySelector("time").textContent = formatDateTime(todo.dueAt);
        list.appendChild(item);
      }
    }

    function formatDateTime(value) {
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function scheduleSync() {
      if (!hasSyncConfig()) return;
      window.clearTimeout(syncTimer);
      syncTimer = window.setTimeout(() => syncNow(), 1600);
    }

    function resetTodoForm() {
      editingId = null;
      titleInput.value = "";
      dueInput.value = "";
      submitTodoButton.textContent = "添加";
      cancelEditButton.hidden = true;
    }

    async function syncNow() {
      if (!hasSyncConfig()) {
        updateSyncStatus("请先填写并保存 GitHub Token 和验证码。");
        return;
      }
      if (!window.crypto || !window.crypto.subtle) {
        updateSyncStatus("当前浏览器不支持加密同步，请用 HTTPS 页面打开。");
        return;
      }
      if (isSyncing) return;

      isSyncing = true;
      syncNowButton.disabled = true;
      updateSyncStatus("正在同步...");

      try {
        await syncWithGitHub();
        updateSyncStatus(`同步完成：${formatDateTime(new Date().toISOString())}`);
      } catch (error) {
        updateSyncStatus(`同步失败：${error.message}`);
      } finally {
        isSyncing = false;
        syncNowButton.disabled = false;
      }
    }

    async function syncWithGitHub() {
      const remote = await fetchRemoteFile();
      let remoteTodos = [];
      let salt = crypto.getRandomValues(new Uint8Array(16));

      if (remote && remote.payload) {
        salt = base64ToBytes(remote.payload.salt);
        const decrypted = await decryptText(remote.payload, syncConfig.code);
        remoteTodos = JSON.parse(decrypted).todos.map(normalizeTodo);
      }

      const merged = mergeTodos(todos, remoteTodos);
      const changed = stableTodos(todos) !== stableTodos(merged) || stableTodos(remoteTodos) !== stableTodos(merged);
      todos = merged;
      saveTodos();
      render();

      if (!changed && remote) return;

      const payload = await encryptText(JSON.stringify({
        version: 2,
        updatedAt: new Date().toISOString(),
        todos: merged
      }), syncConfig.code, salt);

      await putRemoteFile(payload, remote ? remote.sha : null);
    }

    function mergeTodos(localTodos, remoteTodos) {
      const byId = new Map();
      for (const todo of [...localTodos, ...remoteTodos]) {
        const normalized = normalizeTodo(todo);
        const current = byId.get(normalized.id);
        if (!current || new Date(normalized.updatedAt) >= new Date(current.updatedAt)) {
          byId.set(normalized.id, normalized);
        }
      }
      return [...byId.values()];
    }

    function stableTodos(value) {
      return JSON.stringify([...value].map(normalizeTodo).sort((a, b) => a.id.localeCompare(b.id)));
    }

    async function fetchRemoteFile() {
      const response = await fetch(await githubContentsUrl(), {
        headers: githubHeaders()
      });

      if (response.status === 404) return null;
      if (!response.ok) {
        throw new Error(`GitHub 读取失败 ${response.status}`);
      }

      const data = await response.json();
      const text = decodeUtf8(base64ToBytes(data.content.replace(/\s/g, "")));
      return {
        sha: data.sha,
        payload: JSON.parse(text)
      };
    }

    async function putRemoteFile(payload, sha) {
      const body = {
        message: "Sync todo data",
        branch: GITHUB_BRANCH,
        content: bytesToBase64(encodeUtf8(JSON.stringify(payload, null, 2)))
      };
      if (sha) body.sha = sha;

      const response = await fetch(await githubContentsUrl(), {
        method: "PUT",
        headers: githubHeaders(),
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`GitHub 保存失败 ${response.status} ${detail.slice(0, 80)}`);
      }
    }

    async function githubContentsUrl() {
      const path = await syncFilePath();
      return `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
    }

    function githubHeaders() {
      return {
        Accept: "application/vnd.github+json",
        Authorization: `Bearer ${syncConfig.token}`,
        "Content-Type": "application/json",
        "X-GitHub-Api-Version": "2022-11-28"
      };
    }

    function hasSyncConfig() {
      return Boolean(syncConfig.token && syncConfig.code);
    }

    async function syncFilePath() {
      const digest = await crypto.subtle.digest("SHA-256", encodeUtf8(syncConfig.code));
      const key = bytesToBase64Url(new Uint8Array(digest)).slice(0, 24);
      return `${SYNC_FILE_PREFIX}${key}${SYNC_FILE_SUFFIX}`;
    }

    async function encryptText(text, passphrase, salt) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(passphrase, salt);
      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        encodeUtf8(text)
      );
      return {
        version: 1,
        algorithm: "AES-GCM",
        kdf: "PBKDF2-SHA256",
        iterations: 120000,
        salt: bytesToBase64(salt),
        iv: bytesToBase64(iv),
        data: bytesToBase64(new Uint8Array(encrypted))
      };
    }

    async function decryptText(payload, passphrase) {
      const salt = base64ToBytes(payload.salt);
      const iv = base64ToBytes(payload.iv);
      const key = await deriveKey(passphrase, salt);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        base64ToBytes(payload.data)
      );
      return decodeUtf8(new Uint8Array(decrypted));
    }

    async function deriveKey(passphrase, salt) {
      const material = await crypto.subtle.importKey(
        "raw",
        encodeUtf8(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    function encodeUtf8(text) {
      return new TextEncoder().encode(text);
    }

    function decodeUtf8(bytes) {
      return new TextDecoder().decode(bytes);
    }

    function bytesToBase64(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i += 1) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function bytesToBase64Url(bytes) {
      return bytesToBase64(bytes).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function updateSyncStatus(message) {
      syncStatus.textContent = message;
    }

    render();
  </script>
</body>
</html>
