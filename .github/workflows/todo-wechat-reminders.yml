name: Todo WeChat reminders

on:
  schedule:
    # Beijing time 12:00 and 00:00. GitHub cron uses UTC.
    - cron: "0 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send reminders
        run: node scripts/send-wechat-reminders.mjs
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TODO_LIBRARY_CODES: ${{ secrets.TODO_LIBRARY_CODES }}

      - name: Commit reminder state
        run: |
          if ! git diff --quiet -- reminder-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reminder-state.json
            git commit -m "Update reminder state"
            git push
          fi
